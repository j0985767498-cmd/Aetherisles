<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雲海群島 - 骨架對折診斷版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111827; font-family: monospace; }
    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    #diag {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); color: #e2e8f0;
      padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.2); max-width: 85vw; white-space: pre-wrap;
    }
    input[type="file"] { margin-top: 6px; font-size: 11px; color: #93c5fd; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.5/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="diag">
      <div id="diag-text">正在載入模型...</div>
      <input type="file" id="vrm-upload" accept=".vrm" />
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const diagEl = document.getElementById('diag-text');
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x64748b);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / Math.max(container.clientHeight, 1), 0.1, 100);
    camera.position.set(0, 1.3, 3.4);
    camera.lookAt(0, 1.0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x475569, 1.5));
    const dir = new THREE.DirectionalLight(0xffffff, 2.0);
    dir.position.set(3, 5, 4);
    scene.add(dir);

    const grid = new THREE.GridHelper(10, 10);
    scene.add(grid);

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    let currentVrm = null;

    function loadVrm(url) {
      diagEl.textContent = '載入 VRM 中...';
      loader.load(url, (gltf) => {
        if (currentVrm) scene.remove(currentVrm.scene);
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        // 完全不改任何骨頭 rotation，只看原始 VRM 站姿
        vrm.scene.rotation.set(0, Math.PI, 0);
        vrm.scene.position.set(0, 0, 0);
        scene.add(vrm.scene);
      }, undefined, (err) => {
        diagEl.textContent = '載入失敗：' + (err?.message || err);
      });
    }

    loadVrm('./model%204.vrm');

    document.getElementById('vrm-upload').addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (f) loadVrm(URL.createObjectURL(f));
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      if (currentVrm) {
        currentVrm.update(delta);
        const hips = currentVrm.humanoid?.getNormalizedBoneNode('hips');
        const spine = currentVrm.humanoid?.getNormalizedBoneNode('spine');
        const chest = currentVrm.humanoid?.getNormalizedBoneNode('chest');
        const fmt = (b) => b ? `(${b.rotation.x.toFixed(2)}, ${b.rotation.y.toFixed(2)}, ${b.rotation.z.toFixed(2)})` : '無';
        const hPos = hips ? `${hips.position.x.toFixed(2)}, ${hips.position.y.toFixed(2)}, ${hips.position.z.toFixed(2)}` : '無';
        diagEl.textContent =
          `【純原始 VRM 診斷（未套用任何動作）】\n` +
          `hips pos: ${hPos}\n` +
          `hips rot: ${fmt(hips)}\n` +
          `spine rot: ${fmt(spine)}\n` +
          `chest rot: ${fmt(chest)}`;
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

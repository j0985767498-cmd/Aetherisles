<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雲海群島 - 階段一效能與手感測試</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2639; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    /* 右上角效能監控 */
    #hud-stats {
      position: absolute; top: 12px; right: 12px;
      background: rgba(15, 23, 42, 0.78); color: #e2e8f0;
      padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.15); pointer-events: none;
    }
    .stat-good { color: #4ade80; font-weight: bold; }
    .stat-warn { color: #facc15; font-weight: bold; }
    .stat-bad  { color: #f87171; font-weight: bold; }

    /* 左上角載入狀態 */
    #hud-status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.78); color: #cbd5e1;
      padding: 8px 12px; border-radius: 8px; font-size: 12px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    #vrm-upload { margin-top: 6px; font-size: 11px; color: #93c5fd; display: block; }

    /* 左下角虛擬搖桿 */
    #joystick-zone {
      position: absolute; bottom: 28px; left: 28px;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.25);
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px; margin: -22px 0 0 -22px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.65);
      pointer-events: none;
    }

    /* 右下角測試按鍵 */
    #action-buttons {
      position: absolute; bottom: 28px; right: 28px;
      display: flex; gap: 14px; align-items: flex-end;
    }
    .btn-action {
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
      color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center;
      background: rgba(30, 41, 59, 0.75); active: scale(0.92);
    }
    #btn-dodge { width: 62px; height: 62px; font-size: 13px; }
    #btn-attack { width: 78px; height: 78px; font-size: 15px; background: rgba(220, 38, 38, 0.7); }
  </style>
  <!-- Import Map: 鎖定穩定版 Three.js 與 @pixiv/three-vrm -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="hud-status">
      <div id="status-text">狀態：等待載入 VRM（預設使用替身）</div>
      <input type="file" id="vrm-upload" accept=".vrm" />
    </div>

    <div id="hud-stats">
      <div>FPS: <span id="stat-fps" class="stat-good">60</span></div>
      <div>渲染倍率: <span id="stat-dpr">1.50</span></div>
      <div>Draw Calls: <span id="stat-calls">0</span></div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="action-buttons">
      <div id="btn-dodge" class="btn-action">閃避</div>
      <div id="btn-attack" class="btn-action">斬擊</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // === 1. 基礎場景與渲染器（關閉即時 shadowMap，上限 1.5） ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b5d6);
    scene.fog = new THREE.FogExp2(0x87b5d6, 0.018);

    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 120);
    camera.position.set(0, 3.2, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.shadowMap.enabled = false; // 手機端強制關閉即時陰影貼圖
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 動態解析度參數
    const MAX_DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    const MIN_DPR = 0.85;
    let currentDpr = MAX_DPR;

    function syncRendererSize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(currentDpr);
      renderer.setSize(w, h, false);
    }
    syncRendererSize();
    window.addEventListener('resize', syncRendererSize);

    // === 2. 日系明亮燈光（無即時陰影開銷） ===
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x6b7c93, 1.35);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff6e5, 2.2);
    dirLight.position.set(5, 10, 6);
    scene.add(dirLight);

    // === 3. 浮空島測試場地與圓形假陰影產生器 ===
    const islandGeo = new THREE.CylinderGeometry(14, 11, 2, 24);
    const islandMat = new THREE.MeshLambertMaterial({ color: 0x6b8e5e });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = -1;
    scene.add(island);

    const gridHelper = new THREE.GridHelper(26, 26, 0xffffff, 0x4b6842);
    gridHelper.position.y = 0.01;
    gridHelper.material.opacity = 0.25;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    function createBlobShadow(radius = 0.65) {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size/2, size/2, 2, size/2, size/2, size/2);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.48)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const tex = new THREE.CanvasTexture(canvas);
      const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.02;
      return mesh;
    }

    // === 4. 玩家角色容器（支援動態替換 VRM 並釋放舊資源） ===
    const playerRoot = new THREE.Group();
    scene.add(playerRoot);
    const playerShadow = createBlobShadow(0.6);
    playerRoot.add(playerShadow);

    // 預設替身（尚未上傳 VRM 時顯示）
    const placeholderMesh = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.32, 1.0, 4, 12),
      new THREE.MeshLambertMaterial({ color: 0x38bdf8 })
    );
    placeholderMesh.position.y = 0.85;
    playerRoot.add(placeholderMesh);

    let currentVrm = null;
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function loadVRMFromUrl(url) {
      document.getElementById('status-text').textContent = '狀態：正在載入 VRM...';
      loader.load(
        url,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          if (!vrm) return;

          // 釋放舊 VRM 記憶體（防止 iOS Safari 爆記憶體）
          if (currentVrm) {
            playerRoot.remove(currentVrm.scene);
            VRMUtils.deepDispose(currentVrm.scene);
          } else {
            playerRoot.remove(placeholderMesh);
          }

          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.removeUnnecessaryJoints(gltf.scene);

          vrm.scene.rotation.y = Math.PI; // VRM 預設面向 +Z，轉向 -Z 前方
          playerRoot.add(vrm.scene);
          currentVrm = vrm;
          document.getElementById('status-text').textContent = '狀態：VRM 已載入（實機壓測中）';
        },
        undefined,
        (err) => {
          console.error(err);
          document.getElementById('status-text').textContent = '狀態：VRM 載入失敗，請確認檔案格式';
        }
      );
    }

    // 支援直接選取本機 .vrm 檔測試（也可把網址改成你 GitHub 上的預設 .vrm 路徑）
    document.getElementById('vrm-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadVRMFromUrl(url);
    });
    // 若你的 GitHub repo 裡已有 model.vrm，取消下面這行註解即可自動載入：
    // loadVRMFromUrl('./model.vrm');

    // === 5. 輕量 GLB/低面數測試怪（非 VRM，包含可破壞弱點部件） ===
    const enemyRoot = new THREE.Group();
    enemyRoot.position.set(0, 0, -4.5);
    scene.add(enemyRoot);
    enemyRoot.add(createBlobShadow(1.1));

    const enemyBody = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1.0, 0),
      new THREE.MeshLambertMaterial({ color: 0x475569 })
    );
    enemyBody.position.y = 1.1;
    enemyRoot.add(enemyBody);

    // 可破壞部位（頭部角晶）
    const hornMat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
    const enemyHorn = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 6), hornMat);
    enemyHorn.position.set(0, 2.25, 0.2);
    enemyRoot.add(enemyHorn);

    let hornHp = 3;
    let enemyHitFlash = 0;

    // === 6. 虛擬搖桿與測試按鍵控制 ===
    const moveInput = { x: 0, z: 0 };
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyTouchId = null;

    joyZone.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      joyTouch
